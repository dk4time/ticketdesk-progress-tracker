<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>TicketDesk Progress Tracker — Login</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="page">
    <main class="view">
      <div class="card">
        <h2>TicketDesk Progress Tracker</h2>
        <p class="hint">Enter the workshop PIN to continue.</p>
        <form id="login-form">
          <input
            id="pin-input"
            type="password"
            inputmode="numeric"
            autocomplete="off"
            placeholder="PIN"
            required
          />
          <button type="submit">Unlock</button>
        </form>
        <p id="login-error" class="error" hidden></p>
      </div>
    </main>
  </div>

  <script src="/js/login.js"></script>
</body>
</html>
